[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repobeacon"
version = "0.1.0"
description = "Local application security scanner orchestration and unified reporting"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
repobeacon = "repobeacon.cli:main"

[tool.setuptools.package-data]
repobeacon = ["rules/*.yaml", "rules/*.toml", "templates/*.css"]

[tool.setuptools.packages.find]
include = ["repobeacon*"]
